<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-0.75 4 64 64" role="img" aria-label="agent-store mark">
  <style>
    .soft { fill: #59636e; }
    .accent { fill: #1a7f37; }
