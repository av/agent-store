  </style>
  <!-- mark: record rows + link graph -->
  <g>
    <rect class="soft" x="6" y="12" width="34" height="10" rx="5"/>
    <rect class="soft" x="6" y="31" width="26" height="10" rx="5"/>
    <rect class="soft" x="6" y="50" width="34" height="10" rx="5"/>
    <path class="link" d="M52 17 C52 26.5 44 26.5 44 36 C44 45.5 52 45.5 52 55" fill="none" stroke-width="3"/>
    <circle class="accent" cx="52" cy="17" r="4.5"/>
    <circle class="accent" cx="44" cy="36" r="4.5"/>
    <circle class="accent" cx="52" cy="55" r="4.5"/>
