[package]
name = "agent-store-cli"
version = "0.1.2"
edition = "2021"
description = "A local-first memory and context store for AI coding agents, backed by SQLite"
license = "MIT"
repository = "https://github.com/av/agent-store"
homepage = "https://github.com/av/agent-store"
documentation = "https://github.com/av/agent-store#readme"
readme = "README.md"
keywords = ["llm", "agent", "memory", "context", "sqlite"]
categories = ["command-line-utilities", "database"]
# Allowlist: ship only what `cargo install` needs. Brand assets, docs site,
# man/completions, tests, and examples live in the repo / release tarballs,
# not in the crates.io package. README image links use absolute GitHub raw
# URLs so they still render on crates.io.
include = [
    "/src/**",
    "/Cargo.toml",
    "/LICENSE",
    "/THIRD-PARTY-LICENSES.md",
    "/README.md",
    "/CHANGELOG.md",
]

# cargo-binstall: fetch prebuilt release binaries instead of compiling.
# Matches the release asset naming, e.g.
# agent-store-v0.1.1-x86_64-unknown-linux-gnu.tar.gz
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/agent-store-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# The crate is published as agent-store-cli (the bare name is taken on
# crates.io by an unrelated project), but the binary and library keep the
# agent-store name.
[lib]
name = "agent_store"
path = "src/lib.rs"

[[bin]]
name = "agent-store"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rand = "0.8.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0.140"
